# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required: []
    properties:
      phpIp2Location:
        type: boolean
        default: true
        description: Indicates if the PHP IP2Location extension is installed.
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    config => ({ command: 'docker', args: ['run', '-p', '80:80', 'drupal-ip-login'], env: {} })
